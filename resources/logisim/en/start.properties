argUsage1  = Options for Graphical User Interface:
argUsage2  = --nosplash         Hides splash screen at startup.
argUsage3  = --geom WxH[+X+Y]   Set geometry for main window.
argUsage4  = --empty            Use empty template.
argUsage5  = --plain            Use standard Logisim template.
argUsage6  = --template file    Use file as template.
argUsage7  = --gates style      Select "shaped", "rectangular", or "german" gate style. Also
argUsage8  = \                  accepts "ansi", "iec", or "din" as synonyms.
argUsage9  = --locale str       Use locale given in str.
argUsage10 = --accents yes|no   Use accented characters or ASCII equivalents.
argUsage11 = --clearprefs       Clear application preferences at startup.
argUsage12 = --questa yes|no    Use Questa Advanced Simulator to validate HDL entities.
argUsage13 = --sub file1 file2  Load file replacing library file1 with file2.
argUsage14 = --test name file   Run test vector from a file against named circuit, then exit.
#         
argUsage15 = Options for Command-Line Interface:
argUsage16 = --version          Display version number and exit.
argUsage17 = --help             Display this summary and exit.
argUsage18 = --list             List all circuits in a file. Use with "--pretty" for
argUsage19 = \                  markdown-like output instead of plain text.
argUsage20 = --inventory        Output a json-formatted inventory of all available components
argUsage21 = \                  from a file or, if no file is given, from the builtin library.
argUsage22 = --pinout comp      Output detailed pinout and bounding box of a component within
argUsage23 = \                  a file or builtin library (or, if no file is given, from the
argUsage24 = \                  builtin library. Specify component as:
argUsage25 = \                    "[libName][componentName]@(x, y) key1=val1 key2=val2 ..."
argUsage26 = \                  where key-value pairs can specify attribute settings.
argUsage27 = \                  If "[libname]" is omitted then all libraries will be searched.
argUsage28 = \                  If "@(x, y)" is omitted then (0, 0) is used.
argUsage29 = --netlist          List each network in the main circuit from a file, including
argUsage30 = \                  connected component ports, wires, tunnels, and splitters.
argUsage31 = \                  If "--circuit name" is given, use the named circuit instead.
argUsage32 = --png name,...     Export named circuits as png images, one image per circuit.
argUsage33 = --png '*'          Export all circuits as png, one image per circuit.
argUsage34 = --tty format       Run circuit simulation and output results to stdout.
argUsage35 = --circuit name     Use the named circuit instead of main.
argUsage36 = \                   This can be used with "--tty table" and "--netlist".
argUsage37 = --load ramfile     Load memory image file into RAM (works with --tty only).
argUsage38 = --pretty           Make some output nicer, markdown-style.
argUsage39 = --debug            Enable interactive simulator debug console
argUsage40 = --verbose, -v      Enable verbose debug output (level 1, repeat for more verbosity)
argUsage41 = -vv, -vvv, -vvvv   Even more verbose (increment 2 levels, 3 levels, etc.)
