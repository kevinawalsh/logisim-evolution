<!DOCTYPE html>
<p><b>Wiring Tool</b> — add or rearrange wires.</p>

<p>See also: <a href="/libs/mouse/wiring.html">Reference</a></p>

<p><b>Drawing Wires:</b></p>
<ul>
  <li><b>Click-drag background</b> &rarr; draw a wire</li>
  <li><b>Click-drag a wire</b> &rarr; change wires or draw new wires</li>
  <li><b>Space</b> &rarr; add corner point while drawing</li>
  <li><b>Delete</b> &rarr; remove a corner point while drawing</li>
  <li><b>Escape</b> &rarr; cancel drawing</li>
</ul>
